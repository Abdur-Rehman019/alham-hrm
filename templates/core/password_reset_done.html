{% extends 'core/base.html' %}
{% block guest_content %}
<div class="d-flex align-items-center justify-content-center" style="min-height:100vh; background: linear-gradient(135deg, #0a1e4d 0%, #063fb0 100%);">
  <div class="card p-4 text-center" style="width: 400px;">
    <i class="bi bi-envelope-check-fill" style="font-size:2.5rem;color:#063fb0;"></i>
    <h5 class="fw-bold mt-2 mb-1">Check Your Email</h5>
    <p class="text-muted small mb-3">If an account exists with that email, reset instructions have been sent.</p>
    <a href="{% url 'login' %}" class="btn btn-outline-primary btn-sm">Back to Login</a>
  </div>
</div>
{% endblock %}
