{% extends 'core/base.html' %}
{% block guest_content %}
<div class="d-flex align-items-center justify-content-center" style="min-height:100vh; background: linear-gradient(135deg, #0a1e4d 0%, #063fb0 100%);">
  <div class="card p-4" style="width: 400px;">
    <div class="text-center mb-3">
      <div style="width:52px;height:52px;border-radius:14px;background:#eef2ff;color:#063fb0;display:flex;align-items:center;justify-content:center;font-size:1.5rem;margin:0 auto .75rem;">
        <i class="bi bi-key-fill"></i>
      </div>
      <h5 class="fw-bold mb-1">Reset Password</h5>
      <p class="text-muted small mb-0">Enter your account's email and we'll send reset instructions.</p>
    </div>
    <form method="post">
      {% csrf_token %}
      <div class="mb-3">
        <label class="form-label small fw-semibold">Email</label>
        <input type="email" name="email" class="form-control" required autofocus>
      </div>
      <button type="submit" class="btn btn-primary w-100">Send Reset Link</button>
    </form>
    <div class="text-center mt-3">
      <a href="{% url 'login' %}" class="small">Back to login</a>
    </div>
  </div>
</div>
{% endblock %}
