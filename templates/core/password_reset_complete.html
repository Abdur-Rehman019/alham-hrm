{% extends 'core/base.html' %}
{% block guest_content %}
<div class="d-flex align-items-center justify-content-center" style="min-height:100vh; background: linear-gradient(135deg, #0a1e4d 0%, #063fb0 100%);">
  <div class="card p-4 text-center" style="width: 400px;">
    <i class="bi bi-check-circle-fill" style="font-size:2.5rem;color:#16a34a;"></i>
    <h5 class="fw-bold mt-2 mb-1">Password Reset</h5>
    <p class="text-muted small mb-3">Your password has been changed. You can now log in.</p>
    <a href="{% url 'login' %}" class="btn btn-primary btn-sm w-100">Log In</a>
  </div>
</div>
{% endblock %}
