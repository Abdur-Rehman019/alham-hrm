{% extends 'core/base.html' %}
{% block title %}Password changed · ALHAM HRM{% endblock %}
{% block guest_content %}
<div class="auth-page">
  <div class="card auth-card text-center">
    <i class="bi bi-check-circle-fill" style="font-size:2.5rem;color:#16a34a;"></i>
    <h5 class="fw-bold mt-2 mb-1">Password Reset</h5>
    <p class="text-muted small mb-3">Your password has been changed. You can now sign in.</p>
    <a href="{% url 'login' %}" class="btn btn-primary w-100">Sign in</a>
  </div>
</div>
{% endblock %}
