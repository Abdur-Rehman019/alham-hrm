{% extends 'core/base.html' %}
{% block guest_content %}
<div class="d-flex align-items-center justify-content-center" style="min-height:100vh; background: linear-gradient(135deg, #0a1e4d 0%, #063fb0 100%);">
  <div class="card p-4" style="width: 380px;">
    <div class="text-center mb-3">
      <div style="width:52px;height:52px;border-radius:14px;background:#eef2ff;color:#063fb0;display:flex;align-items:center;justify-content:center;font-size:1.5rem;margin:0 auto .75rem;">
        <i class="bi bi-buildings-fill"></i>
      </div>
      <h4 class="fw-bold mb-1">ALHAM <span style="color:#dbe803; -webkit-text-stroke: 0.5px #063fb0;">HRM</span></h4>
      <p class="text-muted small mb-0">Sign in to the admin dashboard</p>
    </div>
    {% if form.errors %}
      <div class="alert alert-danger py-2 small">Invalid username or password.</div>
    {% endif %}
    <form method="post">
      {% csrf_token %}
      <div class="mb-3">
        <label class="form-label small fw-semibold">Username</label>
        <input type="text" name="username" class="form-control" required autofocus>
      </div>
      <div class="mb-3">
        <label class="form-label small fw-semibold">Password</label>
        <input type="password" name="password" class="form-control" required>
      </div>
            <button type="submit" class="btn btn-primary w-100">Login</button>
    </form>
    <div class="text-center mt-3">
      <a href="{% url 'password_reset' %}" class="small">Forgot your password?</a>
    </div>
  </div>
</div>
{% endblock %}
